
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: petersonduarte-PT-BR
          outputs: |
            dist/github-snake.svg?color_snake=%2300D9FF&color_dots=%230D1117,%231A2B4C,%232D5B9A,%2358A6FF,%23B58CFF
            dist/github-snake-dark.svg?color_snake=%2300D9FF&color_dots=%230D1117,%231A2B4C,%232D5B9A,%2358A6FF,%23B58CFF

      - name: Commit and push Snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Generate snake animation" || echo "No changes to commit"
       git push --force origin HEAD:output
