name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: petersonduarte-PT-BR
          outputs: |
            dist/github-snake.svg?color_snake=58A6FF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
            dist/github-snake-dark.svg?palette=github-dark&color_snake=58A6FF

      - name: Commit and push Snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Generate snake animation" || echo "No changes to commit"
          git push origin HEAD:output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
