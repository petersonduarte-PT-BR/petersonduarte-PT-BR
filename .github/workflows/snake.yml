name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: petersonduarte-PT-BR
          outputs: |
            dist/github-snake.svg?color_snake=58A6FF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
            dist/github-snake-dark.svg?palette=github-dark&color_snake=58A6FF

      - name: Push Snake
        uses: EndBug/add-and-commit@v9
        with:
          add: "dist"
          message: "Generate snake animation"
          push: true
          new_branch: output
